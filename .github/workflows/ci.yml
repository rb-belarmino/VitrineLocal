name: Production Ready CI

on:
  push:
    branches: [main, master, '001-*']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Quality Gates & Testing
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Prisma Client & Database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Gate 1 - Strict Typecheck
        run: npm run typecheck

      - name: Gate 2 - ESLint (Zero Warnings)
        run: npm run lint

      - name: Gate 3 - Dependency Audit
        run: npm run audit

      - name: Gate 4 - Test Suite with Coverage
        run: npm run test:coverage
